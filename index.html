<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ConectaBico — MVP</title>
  <style>
    :root {
      --bg-base: #060913;
      --glass-bg: rgba(255, 255, 255, 0.055);
      --glass-bg-hover: rgba(255, 255, 255, 0.1);
      --glass-border: rgba(255, 255, 255, 0.13);
      --glass-border-focus: rgba(56, 189, 248, 0.55);
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-dark: #0284c7;
      --whatsapp: #25D366;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg-base);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Esferas de luz ao fundo para dar contraste real ao efeito de vidro */
    .ambient-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(85px);
      opacity: 0.42;
    }

    .orb-1 {
      width: 280px;
      height: 280px;
      background: #0284c7;
      top: -60px;
      left: calc(50% - 240px);
    }

    .orb-2 {
      width: 260px;
      height: 260px;
      background: #10b981;
      bottom: 40px;
      right: calc(50% - 230px);
    }

    .orb-3 {
      width: 220px;
      height: 220px;
      background: #6366f1;
      top: 42%;
      left: calc(50% - 110px);
      opacity: 0.25;
    }

    .app-shell {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      background: rgba(15, 23, 42, 0.48);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-left: 1px solid var(--glass-border);
      border-right: 1px solid var(--glass-border);
      display: flex;
      flex-direction: column;
    }

    header {
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--glass-border);
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand h1 {
      font-size: 1.2rem;
      letter-spacing: -0.4px;
      background: linear-gradient(90deg, #fff, #7dd3fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .badge-ods {
      font-size: 0.68rem;
      background: rgba(56, 189, 248, 0.14);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 600;
    }

    .btn-logout {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--glass-border);
      color: var(--text-muted);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 0.78rem;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-logout:hover {
      background: rgba(239, 68, 68, 0.16);
      border-color: rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }

    main {
      padding: 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.32);
    }

    .greeting {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.88rem;
      margin-bottom: 18px;
      line-height: 1.45;
    }

    /* Inputs e Busca */
    .search-wrapper {
      position: relative;
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .glass-input {
      width: 100%;
      padding: 12px 14px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      color: var(--text-main);
      font-size: 0.92rem;
      outline: none;
      transition: 0.2s;
    }

    .glass-input::placeholder {
      color: #64748b;
    }

    .glass-input:focus {
      border-color: var(--glass-border-focus);
      background: rgba(255, 255, 255, 0.09);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.12);
    }

    .btn-icon {
      padding: 0 14px;
      border-radius: 12px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      color: var(--text-main);
      cursor: pointer;
      font-size: 0.95rem;
      transition: 0.2s;
      flex-shrink: 0;
    }

    .btn-icon:hover {
      background: var(--glass-bg-hover);
      border-color: var(--glass-border-focus);
    }

    /* Login */
    .login-box {
      margin: auto 0;
      padding: 24px 20px;
    }

    .login-header {
      text-align: center;
      margin-bottom: 22px;
    }

    .login-logo {
      width: 54px;
      height: 54px;
      margin: 0 auto 12px;
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.25), rgba(16, 185, 129, 0.25));
      border: 1px solid rgba(56, 189, 248, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
    }

    .field-group {
      margin-bottom: 14px;
    }

    .field-label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 500;
    }

    .pass-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .pass-wrapper .glass-input {
      padding-right: 44px;
    }

    .btn-toggle-pass {
      position: absolute;
      right: 10px;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.95rem;
      padding: 4px;
    }

    .error-msg {
      color: #fca5a5;
      background: rgba(239, 68, 68, 0.14);
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 0.8rem;
      margin-bottom: 14px;
      display: none;
    }

    /* Botões principais */
    .btn-primary {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #0284c7, #0ea5e9);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.94rem;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 4px 16px rgba(2, 132, 199, 0.35);
    }

    .btn-primary:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }

    .btn-secondary {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      font-weight: 500;
      font-size: 0.88rem;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-secondary:hover {
      background: var(--glass-bg-hover);
      border-color: var(--glass-border-focus);
    }

    .btn-back {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      color: var(--accent);
      font-weight: 600;
      font-size: 0.85rem;
      padding: 7px 12px;
      border-radius: 10px;
      cursor: pointer;
      margin-bottom: 16px;
      align-self: flex-start;
      transition: 0.2s;
    }

    .btn-back:hover {
      background: var(--glass-bg-hover);
    }

    /* Categorias e Lista */
    .section-title {
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 12px;
    }

    .category-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }

    .cat-card {
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      padding: 15px;
      text-align: left;
      cursor: pointer;
      transition: 0.2s;
      color: var(--text-main);
    }

    .cat-card:hover {
      background: var(--glass-bg-hover);
      border-color: var(--glass-border-focus);
      transform: translateY(-2px);
    }

    .cat-icon {
      font-size: 1.45rem;
      display: block;
      margin-bottom: 8px;
    }

    .cat-name {
      font-weight: 600;
      font-size: 0.9rem;
    }

    .pills {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 14px;
      scrollbar-width: none;
    }

    .pills::-webkit-scrollbar {
      display: none;
    }

    .pill {
      padding: 7px 13px;
      border-radius: 20px;
      border: 1px solid var(--glass-border);
      background: var(--glass-bg);
      font-size: 0.8rem;
      white-space: nowrap;
      cursor: pointer;
      color: var(--text-muted);
      transition: 0.2s;
    }

    .pill:hover {
      background: var(--glass-bg-hover);
      color: var(--text-main);
    }

    .pill.active {
      background: rgba(56, 189, 248, 0.2);
      color: #fff;
      border-color: var(--accent);
      font-weight: 600;
    }

    .pro-card {
      background: var(--glass-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      padding: 15px;
      margin-bottom: 12px;
      cursor: pointer;
      display: flex;
      gap: 13px;
      align-items: center;
      transition: 0.2s;
    }

    .pro-card:hover {
      background: var(--glass-bg-hover);
      border-color: var(--glass-border-focus);
      transform: translateY(-1px);
    }

    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.22), rgba(99, 102, 241, 0.22));
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #7dd3fc;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .pro-info {
      flex: 1;
    }

    .pro-name {
      font-weight: 700;
      color: var(--text-main);
      font-size: 0.96rem;
    }

    .pro-meta {
      font-size: 0.79rem;
      color: var(--text-muted);
      margin: 2px 0 6px;
    }

    .pro-desc {
      font-size: 0.83rem;
      color: #cbd5e1;
      line-height: 1.4;
    }

    .pro-price {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--accent);
      margin-top: 7px;
    }

    /* Perfil */
    .profile-box {
      padding: 20px;
    }

    .tag {
      display: inline-block;
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.32);
      color: var(--accent);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    .detail-list {
      margin: 12px 0 16px;
      padding-left: 18px;
      color: #cbd5e1;
      font-size: 0.87rem;
      line-height: 1.65;
    }

    .info-row {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 11px 13px;
      border-radius: 10px;
      font-size: 0.85rem;
      color: var(--text-main);
      margin-bottom: 10px;
    }

    .info-row strong {
      color: var(--accent);
    }

    .btn-whatsapp {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #25D366, #16a34a);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.98rem;
      cursor: pointer;
      margin-top: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 6px 20px rgba(37, 211, 102, 0.3);
      transition: 0.2s;
    }

    .btn-whatsapp:hover {
      filter: brightness(1.07);
      transform: translateY(-1px);
    }

    .feedback-toast {
      margin-top: 12px;
      padding: 10px;
      background: rgba(16, 185, 129, 0.16);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: #6ee7b7;
      border-radius: 10px;
      font-size: 0.82rem;
      text-align: center;
      display: none;
    }

    footer {
      text-align: center;
      padding: 14px;
      font-size: 0.74rem;
      color: #64748b;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }
  </style>
</head>
<body>
  <div class="ambient-bg">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <div class="app-shell">
    <header>
      <div class="brand">
        <h1>ConectaBico</h1>
        <span class="badge-ods">ODS 8 • MVP</span>
      </div>
      <button class="btn-logout" id="btn-logout" style="display: none;">Sair</button>
    </header>

    <main id="app"></main>

    <footer>ConectaBico • Inclusão produtiva de autônomos</footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
