<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ConectaBico — MVP</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #e5e7eb; display: flex; justify-content: center; min-height: 100vh; }
    .app-shell {
      width: 100%; max-width: 430px; background: #f8fafc; min-height: 100vh;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08); display: flex; flex-direction: column;
    }
    header {
      background: #0f172a; color: #fff; padding: 18px 20px;
      display: flex; justify-content: space-between; align-items: center;
    }
    header h1 { font-size: 1.25rem; letter-spacing: -0.5px; }
    header span { font-size: 0.72rem; background: #1e293b; color: #38bdf8; padding: 4px 8px; border-radius: 6px; font-weight: 600; }
    main { padding: 20px; flex: 1; }
    .subtitle { color: #475569; font-size: 0.9rem; margin-bottom: 16px; line-height: 1.4; }
    .search-box {
      width: 100%; padding: 12px 14px; border: 1px solid #cbd5e1; border-radius: 10px;
      font-size: 0.95rem; margin-bottom: 18px; background: #fff;
    }
    .section-title { font-size: 0.95rem; font-weight: 700; color: #1e293b; margin-bottom: 12px; }
    .category-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
    .cat-card {
      background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 14px;
      text-align: left; cursor: pointer; transition: 0.15s;
    }
    .cat-card:hover { border-color: #0284c7; background: #f0f9ff; }
    .cat-icon { font-size: 1.4rem; display: block; margin-bottom: 6px; }
    .cat-name { font-weight: 600; font-size: 0.9rem; color: #0f172a; }
    .btn-primary {
      width: 100%; padding: 13px; background: #0284c7; color: #fff; border: none;
      border-radius: 10px; font-weight: 600; font-size: 0.95rem; cursor: pointer;
    }
    .btn-back {
      background: none; border: none; color: #0284c7; font-weight: 600;
      font-size: 0.9rem; cursor: pointer; margin-bottom: 14px; display: inline-flex; align-items: center; gap: 4px;
    }
    .pills { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 12px; }
    .pill {
      padding: 6px 12px; border-radius: 20px; border: 1px solid #cbd5e1; background: #fff;
      font-size: 0.8rem; white-space: nowrap; cursor: pointer; color: #334155;
    }
    .pill.active { background: #0f172a; color: #fff; border-color: #0f172a; }
    .pro-card {
      background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 14px;
      margin-bottom: 12px; cursor: pointer; display: flex; gap: 12px; align-items: center;
    }
    .pro-card:hover { border-color: #94a3b8; }
    .avatar {
      width: 48px; height: 48px; border-radius: 50%; background: #e0f2fe; color: #0369a1;
      font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .pro-info { flex: 1; }
    .pro-name { font-weight: 700; color: #0f172a; font-size: 0.95rem; }
    .pro-meta { font-size: 0.8rem; color: #64748b; margin: 2px 0 6px; }
    .pro-desc { font-size: 0.83rem; color: #334155; line-height: 1.35; }
    .pro-price { font-size: 0.8rem; font-weight: 600; color: #0284c7; margin-top: 6px; }
    .profile-box { background: #fff; border: 1px solid #e2e8f0; border-radius: 14px; padding: 18px; }
    .tag { display: inline-block; background: #e0f2fe; color: #0369a1; font-size: 0.75rem; font-weight: 600; padding: 4px 10px; border-radius: 6px; margin-bottom: 10px; }
    .detail-list { margin: 14px 0; padding-left: 18px; color: #334155; font-size: 0.88rem; line-height: 1.6; }
    .info-row { background: #f1f5f9; padding: 10px 12px; border-radius: 8px; font-size: 0.85rem; color: #1e293b; margin-bottom: 10px; }
    .btn-whatsapp {
      width: 100%; padding: 14px; background: #25D366; color: #fff; border: none;
      border-radius: 10px; font-weight: 700; font-size: 1rem; cursor: pointer; margin-top: 10px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-whatsapp:hover { background: #1ebe5d; }
    .feedback-toast {
      margin-top: 12px; padding: 10px; background: #dcfce7; color: #166534;
      border-radius: 8px; font-size: 0.82rem; text-align: center; display: none;
    }
    footer { text-align: center; padding: 14px; font-size: 0.75rem; color: #94a3b8; }
  </style>
</head>
<body>
  <div class="app-shell">
    <header>
      <h1>ConectaBico</h1>
      <span>ODS 8 • MVP</span>
    </header>
    <main id="app"></main>
    <footer>ConectaBico • Inclusão produtiva de autônomos</footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
